# Configuration du Worker, utilisée par `wrangler deploy` et par Workers Builds (déploiement depuis GitHub).
name = "memory"                      # nom du Worker existant dans Cloudflare
main = "src/index.js"
compatibility_date = "2026-11-15"

# Conserve les variables définies dans le tableau de bord (ACCESS_*, ADMIN_EMAILS) à chaque déploiement.
# Les secrets (MEMORY_SECRET) ne sont jamais touchés par un déploiement.
keep_vars = true

# Adresse publique memory.<sous-domaine>.workers.dev, sans URL de preview par version.
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"                       # doit rester exactement "DB"
database_name = "memoire"
database_id = "9e1381a5-90c1-4bce-8ca8-d74af8c3c910"

[observability]
enabled = true

[observability.logs]
enabled = true

# Buckets R2 privés. Ils doivent exister AVANT le déploiement, sinon celui-ci échoue (l'ancienne version reste en ligne).
# Contenu des fichiers joints (objets f/<id>). Pas de règle de cycle de vie sur ce bucket.
[[r2_buckets]]
binding = "FILES"
bucket_name = "memoire-fichiers"

# Sauvegardes hebdomadaires (db/AAAA-MM-JJ.sql.gz, et copie des fichiers dans files/<id>), listées dans /admin.
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "memoire-sauvegardes"

# Garde-fous de consommation : définir sur le Worker (Settings > Variables and Secrets), pas ici :
#   CF_ACCOUNT_ID  (variable)  identifiant du compte Cloudflare
#   CF_API_TOKEN   (secret)    jeton « Account Analytics : Read »
#   QUOTA_*        (variables, facultatives) seuils, voir src/quota/limits.js
